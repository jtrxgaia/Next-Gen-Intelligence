name: checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run verify
      - run: node benchmarks/edit-safety.mjs --output ci-safety-result.json
      - run: npm run evaluate:example
      - uses: actions/upload-artifact@v4
        with:
          name: safety-${{ matrix.os }}-node-${{ matrix.node }}
          path: code/ci-safety-result.json
